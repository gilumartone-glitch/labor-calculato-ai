  <body>
    <div id="root"></div>
    <script>
      // Auto-recover da schermata bianca su mobile (PWA / Aggiungi a Home).
      // Dopo un deploy, l'HTML in cache punta a bundle JS vecchi che non
      // esistono più: il browser fallisce silenziosamente. Intercettiamo
      // gli errori di caricamento dei moduli e ricarichiamo una volta sola.
      (function () {
        var KEY = '__tf_reloaded_once';
        function isChunkErr(msg) {
          if (!msg) return false;
          msg = String(msg);
          return /Failed to fetch dynamically imported module/i.test(msg)
              || /Importing a module script failed/i.test(msg)
              || /ChunkLoadError/i.test(msg)
              || /Loading chunk [\d]+ failed/i.test(msg)
              || /error loading dynamically imported module/i.test(msg);
        }
        function recover(reason) {
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          // Pulisci eventuali cache (CacheStorage) prima di ricaricare
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }).finally(function () { location.reload(); });
          } else {
            location.reload();
          }
          console.warn('[tf] auto-reload after load error:', reason);
        }
        window.addEventListener('error', function (e) {
          if (isChunkErr(e && (e.message || (e.error && e.error.message)))) recover(e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          var msg = r && (r.message || r);
          if (isChunkErr(msg)) recover(msg);
        });
        // Quando la pagina torna visibile (utente rientra nella PWA),
        // resetta il flag così un eventuale errore futuro può ri-recuperare.
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
          }
        });
      })();
    </script>
